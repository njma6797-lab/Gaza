<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمد نجم - المتابعين والتبرعات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap');

body {
  margin: 0;
  padding: 0;
  background-color: black;
  font-family: 'SF Pro Display', Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}

canvas { position: fixed; top:0; left:0; z-index:0; }

#header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 40px;
  z-index: 1;
  position: relative;
}

#username {
  font-size: 50px;
  font-weight: bold;
  color: #FFD700;
  text-shadow: 3px 3px 15px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  gap: 10px;
}

#username img {
  width: 60px;
  height: 40px;
  border-radius: 4px;
  transform-origin: center;
  transition: transform 0.2s ease;
}

#followers {
  font-size: 26px;
  display: flex;
  align-items: center;
  gap: 10px;
}

#addFan {
  background: rgba(255,255,0,0.8);
  color: black;
  border: none;
  border-radius: 50%;
  width: 38px;
  height: 38px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 0 15px #FFD700;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

#addFan:hover {
  transform: scale(1.3) translateZ(5px);
  box-shadow: 0 0 25px #FFD700;
}

#counter {
  font-size: 36px;
  font-weight: bold;
  margin: 30px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  z-index: 1;
  position: relative;
}

.counter-number {
  font-size: 36px;
  font-weight: bold;
  background: linear-gradient(45deg,#ff0000,#00ff00,#ffff00);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
  display: inline-block;
  transform: translateY(0);
  transition: transform 0.5s cubic-bezier(0.5,1.5,0.5,1), text-shadow 0.5s ease;
}

.glow {
  text-shadow: 0 0 20px #ff0, 0 0 30px #ff0, 0 0 40px #ff0;
}

#thankMessage {
  font-size: 22px;
  font-weight: bold;
  margin: 20px auto;
  color: #ff5722;
  display: none;
  z-index:1;
  position: relative;
  text-align:center;
}

#poem {
  font-size: 22px;
  font-weight: bold;
  margin-top: 60px;
  line-height: 1.6;
  background: linear-gradient(45deg,#ff0000,#00ff00,#ffffff);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 3px 3px 12px rgba(0,0,0,0.5);
  perspective: 1000px;
  padding: 20px 0;
  text-align: center;
}

.btn {
  display: block;
  margin: 12px auto;
  padding: 15px 25px;
  font-size: 18px;
  text-decoration: none;
  color: white;
  border-radius: 12px;
  width: 80%;
  max-width: 400px;
  background: rgba(255,255,255,0.05);
  border: 2px solid #FFD700;
  backdrop-filter: blur(5px);
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s ease;
}

.btn:hover {
  transform: scale(1.05) translateZ(5px);
  box-shadow: 0 0 25px #FFD700;
  background: rgba(255,255,0,0.2);
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="header">
  <div id="username">
    محمد نجم 👑
    <img src="images.jpeg" alt="علم فلسطين" id="palestineFlag">
  </div>
  <div id="followers">
    <span id="fanCount">1,059,894</span> متابع
    <button id="addFan">+</button>
  </div>
</div>

<div id="counter">
  <span class="counter-number">5680</span> متبرع
</div>

<a class="btn" href="sms:9770?body=فلسطين">تبرع عبر رسالة قصيرة (SMS)</a>
<a class="btn" href="tel:*9*166#">تبرع عبر فودافون كاش – الهلال الأحمر المصري</a>
<a class="btn" href="tel:99981">التبرع عبر فوري</a>

<div id="thankMessage">شكراً لدعمك لأخواتك في فلسطين… شكراً يا مصر ❤️</div>

<div id="poem">
  فلسطين حرّة، ومصر سندها، <br>
  قلوبنا متحدة، والأمل لا يموت، <br>
  يدنا تمتد بالحب والسلام، <br>
  نزرع النور ونحمي الأرض بالوفاء
</div>

<script>
// عداد المتبرعين
let counter = parseInt(localStorage.getItem('donorCounter')||'5680');
const counterDiv = document.querySelector('.counter-number');

function animateNumber(newValue){
  const oldNum = parseInt(counterDiv.textContent);
  const diff = newValue - oldNum;
  let i=0;
  function step(){
    if(i<=diff){
      counterDiv.textContent = oldNum+i;
      counterDiv.classList.add('glow');
      counterDiv.style.transform='translateY(-50px)';
      setTimeout(()=>{ counterDiv.style.transform='translateY(0)'; counterDiv.classList.remove('glow');}, 500);
      i++;
      setTimeout(step, 50);
    }
  }
  step();
}

function updateCounter(){
  counter++;
  localStorage.setItem('donorCounter', counter);
  animateNumber(counter);
  setTimeout(updateCounter, 8000);
}
updateCounter();

// فانز الديناميكي مع زر +
const fanCountEl = document.getElementById('fanCount');
const addFanBtn = document.getElementById('addFan');
let fans = parseInt(localStorage.getItem('fanCount')||'1059894');

function updateFans(){
  fanCountEl.textContent = fans.toLocaleString();
  fanCountEl.classList.add('glow');
  setTimeout(()=> fanCountEl.classList.remove('glow'),200);
  localStorage.setItem('fanCount', fans);
}

addFanBtn.addEventListener('click', ()=>{
  fans++;
  updateFans();
  const flag = document.getElementById('palestineFlag');
  flag.style.transform='rotateZ(15deg) scale(1.1)';
  setTimeout(()=>flag.style.transform='rotateZ(0deg) scale(1)',300);
});
updateFans();

// رسالة صوتية
window.addEventListener('load',()=>{
  if(!localStorage.getItem('thankSpoken')){
    const thank = document.getElementById('thankMessage');
    thank.style.display='block';
    const msg = new SpeechSynthesisUtterance();
    msg.text = "شكراً لدعمك لأخواتك في فلسطين… شكراً يا مصر";
    msg.lang='ar-SA';
    window.speechSynthesis.speak(msg);
    localStorage.setItem('thankSpoken','true');
    setTimeout(()=>{thank.style.display='none';},5000);
  }
});

// خلفية النجوم
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
const stars=[];
for(let i=0;i<200;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,radius:Math.random()*1.5+0.5,vx:Math.random()*0.05-0.025,vy:Math.random()*0.05-0.025});
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let s of stars){
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
    ctx.fillStyle='white';
    ctx.fill();
    s.x+=s.vx;
    s.y+=s.vy;
    if(s.x<0)s.x=canvas.width;
    if(s.x>canvas.width)s.x=0;
    if(s.y<0)s.y=canvas.height;
    if(s.y>canvas.height)s.y=0;
  }
  requestAnimationFrame(drawStars);
}
drawStars();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
</script>

</body>
</html>
