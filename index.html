<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمد نجم - فلسطين</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@700&display=swap');

body {
  margin: 0;
  padding: 0;
  font-family: 'SF Pro Display', Arial, sans-serif;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: linear-gradient(135deg,#0b0c10,#660000);
  overflow-x: hidden;
}

canvas { position: fixed; top:0; left:0; z-index:0; }

#header {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 30px;
  z-index: 1;
  text-align: center;
}

#username {
  font-size: 36px;
  font-weight: bold;
  color: #ff0000;
  text-shadow: 2px 2px 12px rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  gap: 10px;
}

#username img {
  width: 50px;
  height: 35px;
  border-radius: 4px;
  transform-origin: center;
  transition: transform 0.2s ease;
}

#followers {
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

#addFan {
  background: linear-gradient(45deg,#8B0000,#FF4500);
  color: white;
  border: none;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 0 15px #ff0000;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

#addFan:hover {
  transform: scale(1.2);
  box-shadow: 0 0 25px #ff0000;
}

#counter {
  font-size: 28px;
  font-weight: bold;
  margin: 25px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  z-index: 1;
}

.counter-number {
  font-size: 28px;
  font-weight: bold;
  background: linear-gradient(45deg,#FF0000,#8B0000);
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
  display: inline-block;
  transform: translateY(0);
  transition: transform 0.5s cubic-bezier(0.5,1.5,0.5,1);
}

#thankMessage {
  font-size: 18px;
  font-weight: bold;
  margin: 15px auto;
  color: #ff4500;
  display: none;
  text-align: center;
  padding: 10px 20px;
  border-radius: 12px;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(4px);
}

.btn {
  display: block;
  margin: 10px auto;
  padding: 12px 20px;
  font-size: 16px;
  text-decoration: none;
  color: white;
  border-radius: 10px;
  width: 85%;
  max-width: 350px;
  background: linear-gradient(45deg,#660000,#FF0000);
  border: 2px solid #fff;
  backdrop-filter: blur(4px);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  text-align: center;
}

.btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #ff0000;
}

#poem {
  font-size: 20px;
  font-weight: bold;
  margin-top: 40px;
  line-height: 1.5;
  background: linear-gradient(45deg,#FF0000,#8B0000,#FF6347);
  -webkit-background-clip: text;
  color: transparent;
  text-align: center;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="header">
  <div id="username">
    محمد نجم 👑
    <img src="images.jpeg" alt="علم فلسطين" id="palestineFlag">
  </div>
  <div id="followers">
    <span id="fanCount">1,059,894</span> متابع
    <button id="addFan">+</button>
  </div>
</div>

<div id="counter">
  <span class="counter-number">5680</span> متبرع
</div>

<a class="btn" href="sms:9770?body=فلسطين">تبرع عبر رسالة قصيرة (SMS)</a>
<a class="btn" href="tel:*9*166#">تبرع عبر فودافون كاش</a>
<a class="btn" href="tel:99981">التبرع عبر فوري</a>

<div id="thankMessage">شكراً لمتابعتك ودعمك الموقع ❤️</div>

<div id="poem">
  فلسطين حرّة، ومصر سندها، <br>
  قلوبنا متحدة، والأمل لا يموت، <br>
  يدنا تمتد بالحب والسلام، <br>
  نزرع النور ونحمي الأرض بالوفاء
</div>

<script>
// عداد المتبرعين
let counter = parseInt(localStorage.getItem('donorCounter')||'5680');
const counterDiv = document.querySelector('.counter-number');

function animateNumber(newValue){
  const oldNum = parseInt(counterDiv.textContent);
  const diff = newValue - oldNum;
  let i=0;
  function step(){
    if(i<=diff){
      counterDiv.textContent = oldNum+i;
      counterDiv.style.transform='translateY(-50px)';
      setTimeout(()=>{ counterDiv.style.transform='translateY(0)'; }, 200);
      i++;
      setTimeout(step, 50);
    }
  }
  step();
}

function updateCounter(){
  counter++;
  localStorage.setItem('donorCounter', counter);
  animateNumber(counter);
  setTimeout(updateCounter, 8000);
}
updateCounter();

// فانز الديناميكي مع زر +
const fanCountEl = document.getElementById('fanCount');
const addFanBtn = document.getElementById('addFan');
let fans = parseInt(localStorage.getItem('fanCount')||'1059894');

function updateFans(){
  fanCountEl.textContent = fans.toLocaleString();
  localStorage.setItem('fanCount', fans);
}

addFanBtn.addEventListener('click', ()=>{
  if(!localStorage.getItem('isOwner')){
    fans++;
    updateFans();
    const flag = document.getElementById('palestineFlag');
    flag.style.transform='rotateZ(15deg) scale(1.1)';
    setTimeout(()=>flag.style.transform='rotateZ(0deg) scale(1)',300);

    // رسالة شكر وتحويل إلى صاحب الموقع
    localStorage.setItem('isOwner','true');
    const thank = document.getElementById('thankMessage');
    thank.textContent = "أنت الآن صاحب الموقع! شكراً لدعمك ❤️";
    thank.style.display='block';
    setTimeout(()=>{thank.style.display='none';},4000);

    addFanBtn.disabled = true;
    addFanBtn.style.opacity = 0.6;
  }
});

updateFans();

// خلفية النجوم
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
const stars=[];
for(let i=0;i<200;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,radius:Math.random()*1.5+0.5,vx:Math.random()*0.05-0.025,vy:Math.random()*0.05-0.025});
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let s of stars){
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
    ctx.fillStyle='white';
    ctx.fill();
    s.x+=s.vx;
    s.y+=s.vy;
    if(s.x<0)s.x=canvas.width;
    if(s.x>canvas.width)s.x=0;
    if(s.y<0)s.y=canvas.height;
    if(s.y>canvas.height)s.y=0;
  }
  requestAnimationFrame(drawStars);
}
drawStars();
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;});
</script>

</body>
</html>
